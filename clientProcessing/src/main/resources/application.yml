spring:
  application:
    name: clientProcessing

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:client_processing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    org.apache.kafka: INFO
    org.hibernate.SQL: INFO
    by.t1.kotor.clientprocessing: DEBUG
    root: DEBUG

metrics:
  execution-threshold-ms: 5000

t1:
  scan-path: by.t1.kotor.clientprocessing
  kafka:
    bootstrap:
      server: ${KAFKA_SERVER:broker_t1:29092}
    consumer:
      group-id: t1-clientprocessing
      max.poll.records: 10
      session-timeout: 10000
      heartbeat.interval: 3000
    producer:
      enable: true
    topic:
      client_cards: client_cards
      client_products: client_products
      client_credit_products: client_credit_products
      client_transactions: client_transactions
      service_logs: service_logs
    listener:
      poll-timeout: 1000

server:
  port: 8081
