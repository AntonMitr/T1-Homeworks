spring:
  application:
    name: accountProcessing

  profiles:
    active: test

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver