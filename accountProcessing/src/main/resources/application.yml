spring:
  application:
    name: accountProcessing

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account_processing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    ROOT: DEBUG
    org.apache.kafka: INFO
    org.hibernate.SQL: INFO
    by.t1.kotor.accountprocessing: DEBUG

cache:
  ttl-ms: 60000

metrics:
  execution-threshold-ms: 5000

t1:
  scan-path: by.t1.kotor.accountprocessing
  kafka:
    services:
      client-processing:
        url: http://client-processing:8081
    bootstrap:
      server: ${KAFKA_SERVER:broker_t1:29092}
    consumer:
      group-id: t1-accountprocessing
      account-id: account-id
      card-id: card-id
      paymentschedule-id: paymentschedule-id
      transaction-id: transaction-id
      payments-id: clientpayments-id
      max.poll.records: 10
      session-timeout: 10000
      heartbeat.interval: 3000
    producer:
      enable: true
    topic:
      client_cards: client_cards
      client_products: client_products
      client_transactions: client_transactions
      client-payments: client-payments
      payment-schedule: payment-schedule
      service_logs: service_logs
    listener:
      poll-timeout: 1000

server:
  port: 8082
