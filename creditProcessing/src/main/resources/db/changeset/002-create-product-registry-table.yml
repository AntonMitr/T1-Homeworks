databaseChangeLog:
  - changeSet:
      id: 2-create-product-registry-table
      author: Kotor
      changes:
        - createTable:
            tableName: product_registry
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: interest_rate
                  type: NUMERIC(5,2)
              - column:
                  name: open_date
                  type: DATE
                  constraints:
                    nullable: false
