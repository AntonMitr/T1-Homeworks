databaseChangeLog:
  - changeSet:
      id: create-payment-registry-table-2
      author: Kotor
      changes:
        - createTable:
            tableName: payment_registry
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_registry_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: payment_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: interest_rate_amount
                  type: NUMERIC(18,2)
              - column:
                  name: debt_amount
                  type: NUMERIC(18,2)
              - column:
                  name: expired
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: payment_expiration_date
                  type: DATE
        - addForeignKeyConstraint:
            baseTableName: payment_registry
            baseColumnNames: product_registry_id
            constraintName: fk_payment_registry_product_registry
            referencedTableName: product_registry
            referencedColumnNames: id
