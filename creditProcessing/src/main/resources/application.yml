spring:
  application:
    name: creditProcessing

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit_processing}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    org.apache.kafka: INFO
    org.hibernate.SQL: INFO
    by.t1.kotor.creditprocessing: DEBUG
    root: DEBUG

t1:
  scan-path: by.t1.kotor.creditprocessing
  credit:
    max-total-debt: 1000000  # лимит N
  services:
    client-processing:
      url: http://client-processing:8081
    account-processing:
      url: http://account-processing:8082
  kafka:
    bootstrap:
      server: ${KAFKA_SERVER:broker_t1:29092}
    consumer:
      group-id: t1-creditprocessing
      product-id: product-id
      max.poll.records: 10
      session-timeout: 10000
      heartbeat.interval: 3000
    producer:
      enable: true
    topic:
      client_credit_products: client_credit_products
    listener:
      poll-timeout: 1000

server:
  port: 8083
