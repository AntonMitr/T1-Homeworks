version: '3.8'

services:
  client-processing:
    build: ./clientProcessing
    container_name: client-processing
    ports:
      - "8081:8081"
    environment:
      DB_HOST: client-db
      DB_PORT: 5432
      DB_NAME: client_processing
      DB_USER: postgres
      DB_PASSWORD: admin
      KAFKA_SERVER: broker_t1:29092
    depends_on:
      - client-db
      - broker_t1
      - broker_2_t1

  client-db:
    image: postgres:15
    container_name: client-db
    environment:
      POSTGRES_DB: client_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - client-data:/var/lib/postgresql/data

  account-processing:
    build: ./accountProcessing
    container_name: account-processing
    ports:
      - "8082:8082"
    environment:
      DB_HOST: account-db
      DB_PORT: 5432
      DB_NAME: account_processing
      DB_USER: postgres
      DB_PASSWORD: admin
    depends_on:
      - account-db
      - broker_t1
      - broker_2_t1

  account-db:
    image: postgres:15
    container_name: account-db
    environment:
      POSTGRES_DB: account_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - account-data:/var/lib/postgresql/data

  credit-processing:
    build: ./creditProcessing
    container_name: credit-processing
    ports:
      - "8083:8083"
    environment:
      DB_HOST: credit-db
      DB_PORT: 5432
      DB_NAME: credit_processing
      DB_USER: postgres
      DB_PASSWORD: admin
    depends_on:
      - credit-db
      - broker_t1
      - broker_2_t1

  credit-db:
    image: postgres:15
    container_name: credit-db
    environment:
      POSTGRES_DB: credit_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5435:5432"
    volumes:
      - credit-data:/var/lib/postgresql/data

  zookeeper_t1:
    image: confluentinc/cp-zookeeper:5.5.0
    hostname: zookeeper_t1
    container_name: zookeeper_t1
    ports:
      - "2182:2182"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000

  broker_t1:
    image: confluentinc/cp-kafka:5.5.0
    hostname: broker_t1
    container_name: broker_t1
    depends_on:
      - zookeeper_t1
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper_t1:2182'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker_t1:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  broker_2_t1:
    image: confluentinc/cp-kafka:5.5.0
    hostname: broker_2_t1
    container_name: broker_2_t1
    depends_on:
      - zookeeper_t1
    ports:
      - "29093:29092"
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper_t1:2182'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker_2_t1:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker_t1:29092,broker_2_t1:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper_t1:2182
    depends_on:
      - broker_t1
      - broker_2_t1
      - zookeeper_t1

volumes:
  client-data:
  account-data:
  credit-data:
